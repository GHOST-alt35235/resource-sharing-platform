server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: resource-sharing
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/resource_sharing?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: cn.edu.wynu.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-read-header: true

points:
  register-gift: 100
  upload-reward: 10
  download-cost: 5

file:
  upload-path: ./uploads
  allowed-types: jpg,jpeg,png,gif,pdf,zip,rar,doc,docx,xls,xlsx
  max-size: 10485760
